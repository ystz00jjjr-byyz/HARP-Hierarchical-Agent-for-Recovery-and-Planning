  - id: recover_bin_center_replace
    primitive: replace_at_bin_center
    code: |
      target_center, target_extent, rim_z = get_target_region("target")
      target_object_center = target_center.copy()
      target_object_center[2] += 0.5 * float(primary_extent[2])
      target_gripper = target_object_center + (grasp_pos - current_pos)
      entry = target_gripper.copy()
      entry[2] = max(rim_z + 0.08, target_gripper[2] + 0.08)
      goto_pose(entry, grasp_quat)
      goto_pose(target_gripper, grasp_quat)
      open_gripper()
    preconditions:
      target_grasped: true
      object_lifted: true
      wrong_object_grasped: false
    success_conditions:
      object_inside_container: true
      task_completed: true
      gripper_open: true
      object_stable: true
    failure_routes:
      PRECONDITION_FAILED: GRASP_RECOVERY_FAILED
      POSTCONDITION_FAILED: BIN_PLACE_RECOVERY_FAILED
      OBJECT_UNSTABLE: BIN_PLACE_RECOVERY_FAILED
      SANDBOX_ERROR: BIN_PLACE_RECOVERY_FAILED
    metadata:
      status: formal
      scope: bin_place
      terminal_release: true
      accept_semantic_stability: true

  - id: recover_bin_grasp_replan
    primitive: replan_grasp_from_current_rgbd
    parameters:
      primary_pose: cube_poses_robot_base.primary
      primary_extent: cube_extents_robot_base.primary
    code: |
      import numpy as np

      primary_pose = np.asarray(_offline_params["primary_pose"], dtype=float)
      primary_extent = np.asarray(_offline_params["primary_extent"], dtype=float)
      current_pos = primary_pose[:3]
      approach = max(0.08, 2.0 * float(primary_extent[2]))
      lift = max(0.15, 3.0 * float(primary_extent[2]))
      baseline_z = float(current_pos[2])
      current_quat = primary_pose[3:7]
      w, x, y, z = current_quat / np.linalg.norm(current_quat)
      yaw = np.arctan2(2.0 * (w * z + x * y), 1.0 - 2.0 * (y * y + z * z))
      topdown_quat = (
          np.array([0.0, 0.0, 1.0, 0.0])
          if float(np.max(primary_extent[:2]) / np.min(primary_extent[:2])) < 1.35
          else np.array([0.0, -np.sin(0.5 * yaw), np.cos(0.5 * yaw), 0.0])
      )
      for attempt in range(2):
          if attempt == 0:
              grasp_pos = current_pos + np.array([
                  0.0, 0.0, max(0.004, 0.175 * float(primary_extent[2]))
              ])
              grasp_quat = topdown_quat
          else:
              grasp_pos, grasp_quat = sample_grasp_pose("primary")
          home_pose()
          open_gripper()
          goto_pose(grasp_pos, grasp_quat, z_approach=approach)
          close_gripper()
          goto_pose(grasp_pos + np.array([0.0, 0.0, lift]), grasp_quat)
          target_grasp_pos = grasp_pos
          target_grasp_quat = grasp_quat
          observed_pos, _, _ = get_object_pose("primary", return_bbox_extent=True)
          if float(observed_pos[2]) >= baseline_z + max(0.04, float(primary_extent[2])):
              break
    preconditions:
      bin_policy_eligible: true
    success_conditions:
      target_grasped: true
      object_lifted: true
      wrong_object_grasped: false
    failure_routes:
      PRECONDITION_FAILED: BIN_ENTRY_BLOCKED
      POSTCONDITION_FAILED: BIN_GRASP_REPLAN_FAILED
      SANDBOX_ERROR: BIN_GRASP_REPLAN_FAILED
    next: stage_002
    metadata:
      status: formal
      scope: bin_place_multi_shape
      validation_evidence: outputs/bin_place_geometry_sweep_30_final_v8_20260919/offline_no-model
      grasp_pose_source: current_pose_then_live_contact_graspnet
      accept_semantic_stability: true
      accept_semantic_failure: true
      accept_semantic_success: true

  - id: recover_budget_safe_stop
    primitive: safe_stop
    code: |
      open_gripper()
    success_conditions:
      gripper_open: true
    metadata:
      status: formal
      terminal: safe_stop
