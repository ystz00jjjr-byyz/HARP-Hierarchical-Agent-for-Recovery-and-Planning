  - id: candidate_move_primary_into_workspace
    primitive: push_primary_to_safe_workspace
    parameters:
      primary_pose: cube_poses_robot_base.primary
      primary_extent: cube_extents_robot_base.primary
    code: |
      import numpy as np

      primary_pose = np.asarray(_offline_params["primary_pose"], dtype=float)
      primary_extent = np.asarray(_offline_params["primary_extent"], dtype=float)
      current_pos = primary_pose[:3]
      workspace_was_pushed = abs(float(current_pos[1])) >= 0.27
      if workspace_was_pushed:
          inward_y = -np.sign(current_pos[1])
          push_quat = np.array([0.0, 0.0, 1.0, 0.0])
          tool_z = current_pos[2] + max(0.004, 0.175 * float(primary_extent[2]))
          push_start = current_pos + np.array([
              0.0,
              -inward_y * (0.5 * float(primary_extent[1]) + 0.025),
              tool_z - current_pos[2],
          ])
          push_distance = abs(float(current_pos[1])) - 0.20
          push_end = current_pos + np.array([
              0.0, inward_y * push_distance, tool_z - current_pos[2]
          ])
          home_pose()
          close_gripper()
          goto_pose(push_start, push_quat, z_approach=0.08)
          goto_pose(push_end, push_quat)
          home_pose()
          open_gripper()
    preconditions:
      workspace_recovery_feasible: true
      object_stable: true
    success_conditions:
      object_inside_nominal_workspace: true
      object_near_workspace_boundary: false
      object_stable: true
    failure_routes:
      PRECONDITION_FAILED: OBJECT_OUT_OF_WORKSPACE_UNRECOVERABLE
      POSTCONDITION_FAILED: WORKSPACE_MOVE_FAILED
      SANDBOX_ERROR: WORKSPACE_MOVE_FAILED
