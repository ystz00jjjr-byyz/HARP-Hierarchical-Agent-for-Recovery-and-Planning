env:
  _target_: capx.envs.tasks.franka.franka_bin_place.FrankaBinPlaceCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_bin_place_low_level
    low_level_kwargs:
      cube_half_sizes: 0.02,0.02,0.02
      max_steps: 2200
      object_shape: ${oc.env:BIN_PLACE_OBJECT_SHAPE,cube}
      scenario_sweep: ${oc.env:BIN_PLACE_SCENARIO_SWEEP,false}
      unknown_anomaly_id: ${oc.env:BIN_PLACE_UNKNOWN_ANOMALY_ID}
      object_out_of_workspace_offset: ${oc.env:BIN_PLACE_OBJECT_OUT_OFFSET,0.65 -0.45 0.0}
    privileged: true
    enable_render: true
    apis: [FrankaControlPrivilegedApi]
    multi_turn_prompt: null

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
use_visual_feedback: true
use_legacy_multi_turn_decision_prompt: false
save_multiturn_prompts: true
trials: 10
num_workers: 1
max_trial_retries: 1
trial_timeout_seconds: 1000
output_dir: ${oc.env:BIN_PLACE_OUTPUT_DIR}

world_state_recorder:
  enabled: true
  record_every_n_sim_steps: 10
  record_rgb: false
  record_depth: false
  compress_arrays: true

execution_guard:
  enabled: true
  reject_empty_code: true
  max_robot_api_calls_per_block: 9
  max_expensive_loop_iterations: 2
  finish_requires_task_completed: true
  max_decision_reprompts: 1
  stage_expectations:
    - name: primary_grasped
      required:
        target_grasped: true
        object_lifted: true
        wrong_object_grasped: false
    - name: primary_inside_bin
      required:
        object_inside_container: true
        task_completed: true
        gripper_open: true
        object_stable: true

text_world_state_feedback:
  enabled: true
  window_size: 3
  min_stable_fraction: 0.6667
  numeric_abs_tolerance: 0.015
  numeric_rel_tolerance: 0.05
  include_entities: false
  fail_open: false
  loop_guard_enabled: true
  max_same_failure_retries: 2
  min_progress_delta: 0.01
  action_aligned_window: true
  wait_for_stability: true
  stability_wait_steps: 5
  sample_sim_steps: 3

hybrid_recovery:
  enabled: true
  policy_first: true
  max_model_fallbacks_per_exception: 1
  max_model_fallbacks_total: 1
  model_recovery_stage_indices: [0, 1]
  model_recovery_template: bin_place_regrasp_replace_v1
  min_remaining_sim_steps_before_regrasp: 320
  policy_preconditions:
    bin_policy_eligible: true
    container_entry_clear: true
  task_graph: env_configs/bin_place/offline_task_graph.yaml
  action_library: env_configs/recovery/grasp_miss_actions.yaml
  recovery_library: env_configs/bin_place/recovery_library.yaml
  stage_actions: [stage_001, stage_002]
