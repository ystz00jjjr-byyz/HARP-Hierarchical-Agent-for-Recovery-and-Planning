env:
  _target_: capx.envs.tasks.franka.franka_lift.FrankaLiftCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_cube_lift_low_level
    low_level_kwargs:
      inject_first_grasp_miss: true
    privileged: false
    apis:
      - FrankaControlApi
    prompt: |
      You are controlling a Franka Emika robot. Goal: lift the red cube.
      Generate exactly three short executable stages separated by the literal
      line breakpoint_code_block(). Stage 1 localizes and approaches the cube
      with the gripper open. Stage 2 moves to the grasp pose and closes the
      gripper. Stage 3 lifts the grasped cube. Variables persist between stages.
      Each stage must contain at most eight physical robot-action calls.
    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      Console stdout:
      ```
      {console_stdout}
      ```
      Console stderr:
      ```
      {console_stderr}
      ```
      The hard stage result and K=3 state are authoritative. The offline policy
      library was already tried first. Respond with exactly one of CONTINUE,
      FINISH, or REGENERATE followed by one short Python recovery stage.

api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1
    checkpoint_path: ${oc.env:SAM3_CHECKPOINT,./checkpoints/sam3.pt}
  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
use_legacy_multi_turn_decision_prompt: false
save_multiturn_prompts: true
trials: 1
num_workers: 1
max_trial_retries: 1
trial_timeout_seconds: 1000
output_dir: ./outputs/cube_lifting_hybrid_grasp_miss_proof/hit

world_state_recorder:
  enabled: true
  record_every_n_sim_steps: 10
  record_rgb: false
  record_depth: false
  compress_arrays: true

execution_guard:
  enabled: true
  reject_empty_code: true
  max_robot_api_calls_per_block: 8
  max_expensive_loop_iterations: 0
  finish_requires_task_completed: true
  max_decision_reprompts: 2
  stage_expectations:
    - name: approached_with_open_gripper
      required:
        gripper_open: true
    - name: target_grasped
      required:
        target_grasped: true
    - name: target_lifted
      required:
        task_completed: true

text_world_state_feedback:
  enabled: true
  window_size: 3
  min_stable_fraction: 0.6667
  numeric_abs_tolerance: 0.01
  numeric_rel_tolerance: 0.05
  include_entities: true
  fail_open: false
  loop_guard_enabled: true
  max_same_failure_retries: 2
  min_progress_delta: 0.01
  action_aligned_window: true
  wait_for_stability: true
  stability_wait_steps: 20
  sample_sim_steps: 3

hybrid_recovery:
  enabled: true
  task_graph: env_configs/cube_lifting/hybrid_grasp_miss.graph.yaml
  action_library: env_configs/recovery/grasp_miss_actions.yaml
  recovery_library:
    GRASP_MISS:
      - recover_grasp_miss_live_plan
      - recover_grasp_miss_live_plan
  stage_actions: [stage_001, stage_002, stage_003]
