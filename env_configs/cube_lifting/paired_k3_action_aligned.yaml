env:
  _target_: capx.envs.tasks.franka.franka_lift.FrankaLiftCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_cube_lift_low_level
    privileged: false
    apis:
      - FrankaControlApi
    prompt: |
      You are controlling a Franka Emika robot with API described below.
      Goal: pick up the red cube and lift it.
      Build a three-stage executable plan separated by the literal line
      breakpoint_code_block(). Stage 1: localize and safely approach the red
      cube with the gripper open. Stage 2: move to the grasp pose and close the
      gripper. Stage 3: lift the red cube to a safe height. Variables persist
      across stages. After each stage you receive an action-aligned K=3 state
      window. Import numpy explicitly if needed.
    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      Console stdout:
      ```
      {console_stdout}
      ```
      Console stderr:
      ```
      {console_stderr}
      ```
      Use the text world state and recovery directive. FINISH only when
      task_completed is true. Respond with exactly one:
      - CONTINUE if the current stage passed and the next stage is safe.
      - REGENERATE followed by new Python code in a fenced code block.
      - FINISH if task_completed is true.

api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1
    checkpoint_path: ${oc.env:SAM3_CHECKPOINT,./checkpoints/sam3.pt}
  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: false
use_legacy_multi_turn_decision_prompt: false
save_multiturn_prompts: true
world_state_recorder:
  enabled: true
  record_every_n_sim_steps: 10
  record_rgb: false
  record_depth: false
  compress_arrays: true
trials: 5
num_workers: 1
output_dir: ./outputs/paired_capx_k3_two_tasks/simple_cube_lift/k3_action_aligned
text_world_state_feedback:
  enabled: true
  window_size: 3
  min_stable_fraction: 0.6667
  numeric_abs_tolerance: 0.01
  numeric_rel_tolerance: 0.05
  include_entities: true
  fail_open: false
  loop_guard_enabled: true
  max_same_failure_retries: 2
  min_progress_delta: 0.01
  action_aligned_window: true
  wait_for_stability: true
  stability_wait_steps: 20
  sample_sim_steps: 3

