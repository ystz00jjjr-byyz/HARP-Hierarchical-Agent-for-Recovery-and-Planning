env:
  _target_: capx.envs.tasks.franka.franka_region_place.FrankaRegionPlaceCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_bin_place_low_level
    low_level_kwargs:
      cube_half_sizes: 0.02,0.02,0.02
      max_steps: 3200
      scenario_sweep: true
      workspace_edge_sweep: true
      target_mode: region
      world_state_source: camera_rgbd
      inject_primary_release_failures: 2
      primary_release_fault_offset: 0.06
    privileged: false
    enable_render: true
    apis: [FrankaControlApi]
    prompt: |
      Control the Franka robot using only the provided APIs. Place the primary
      object fully inside the marked planar target region, release it gently,
      and leave the gripper open. Use live observations rather than hidden
      simulator state. Plan exactly two short executable stages separated by
      breakpoint_code_block(): first grasp and lift, then place and retreat.
      If the nonprivileged state says the object or target is unobserved,
      unreachable, blocked, or geometrically infeasible, do not grasp.
    multi_turn_prompt: |
      Use the image, hard stage result, and nonprivileged K=3 world state.
      Return REGENERATE with one short recovery response, or FINISH only when
      task_completed is explicitly true. Do not use hidden simulator state or
      unbounded retries.

api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1
    checkpoint_path: ${oc.env:SAM3_CHECKPOINT,./checkpoints/sam3.pt}
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
use_visual_feedback: true
use_legacy_multi_turn_decision_prompt: false
save_multiturn_prompts: true
trials: 50
num_workers: 1
max_trial_retries: 1
trial_timeout_seconds: 1000
output_dir: ${oc.env:REGION_PLACE_OUTPUT_DIR,./outputs/formal_region_ab/native}

world_state_recorder:
  enabled: true
  record_every_n_sim_steps: 10
  record_rgb: false
  record_depth: false
  compress_arrays: true

execution_guard:
  enabled: true
  reject_empty_code: true
  max_robot_api_calls_per_block: 12
  max_expensive_loop_iterations: 0
  finish_requires_task_completed: true
  max_decision_reprompts: 2

text_world_state_feedback:
  enabled: true
  window_size: 3
  min_stable_fraction: 0.6667
  numeric_abs_tolerance: 0.015
  numeric_rel_tolerance: 0.05
  include_entities: false
  fail_open: false
  loop_guard_enabled: true
  max_same_failure_retries: 2
  min_progress_delta: 0.01
  action_aligned_window: true
  wait_for_stability: true
  stability_wait_steps: 5
  sample_sim_steps: 3

metadata:
  experiment: formal_region_place_levels_ab
  level: native_capx
  seeds: 21-50
  fault: double_release
  expected_infeasible_seeds: [30, 40, 50]
