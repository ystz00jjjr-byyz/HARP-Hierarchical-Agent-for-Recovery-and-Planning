env:
  _target_: capx.envs.tasks.franka.franka_region_place.FrankaRegionPlaceCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_bin_place_low_level
    low_level_kwargs:
      cube_half_sizes: 0.02,0.02,0.02
      max_steps: 3200
      scenario_sweep: true
      workspace_edge_sweep: true
      target_mode: region
      world_state_source: camera_rgbd
      inject_primary_release_failures: 2
      primary_release_fault_offset: 0.06
    privileged: false
    enable_render: true
    apis: [FrankaControlApi]
    prompt: |
      Plan the region-place task as one bounded recovery_graph_v1 object.
      Return exactly one raw JSON object and no markdown, prose, or robot code.
      Use this ordered skill graph, with optional leading safe_home:
      reobserve_object, sample_grasp, regrasp, reobserve_target, replace,
      verify. sample_grasp chooses mode; regrasp chooses approach_clearance
      and lift_clearance; replace chooses entry_clearance.
    multi_turn_prompt: |
      Use the image, hard stage result, and nonprivileged RGB-D K=3 state.
      Known failures are recovered by the formal offline strategy library.
      Replan only the remaining normal task. Unknown or failed-policy recovery
      uses the separate recovery_graph_v1 structured-object channel. Return
      FINISH only when task_completed is explicitly true.

api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1
    checkpoint_path: ${oc.env:SAM3_CHECKPOINT,./checkpoints/sam3.pt}
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
use_visual_feedback: true
use_legacy_multi_turn_decision_prompt: false
save_multiturn_prompts: true
trials: 1
num_workers: 1
max_trial_retries: 1
trial_timeout_seconds: 1000
max_model_requests_per_trial: 3
output_dir: ${oc.env:REGION_PLACE_OUTPUT_DIR,./outputs/l4_model_led_recovery_graph}

world_state_recorder:
  enabled: true
  record_every_n_sim_steps: 10
  record_rgb: false
  record_depth: false
  compress_arrays: true

execution_guard:
  enabled: true
  reject_empty_code: true
  max_robot_api_calls_per_block: 12
  max_expensive_loop_iterations: 0
  finish_requires_task_completed: true
  max_decision_reprompts: 2

text_world_state_feedback:
  enabled: true
  window_size: 3
  min_stable_fraction: 0.6667
  numeric_abs_tolerance: 0.015
  numeric_rel_tolerance: 0.05
  include_entities: false
  fail_open: false
  loop_guard_enabled: true
  max_same_failure_retries: 2
  min_progress_delta: 0.01
  action_aligned_window: true
  wait_for_stability: true
  stability_wait_steps: 5
  sample_sim_steps: 3

hybrid_recovery:
  enabled: true
  policy_first: false
  model_led_policy_recovery: true
  max_model_fallbacks_per_exception: 1
  max_model_fallbacks_total: 1
  model_initial_plan_template: recovery_graph_v1
  model_recovery_stage_indices: [0, 1]
  model_recovery_template: recovery_graph_v1
  model_recovery_candidate_limit: 2
  min_remaining_sim_steps_before_regrasp: 320
  policy_preconditions:
    target_observation_ready: true
    workspace_reachable: true
    target_region_policy_eligible: true
    target_region_clear: true
  task_graph: env_configs/region_place/offline_task_graph.yaml
  recovery_library: env_configs/region_place/formal_ab_improved_recovery_library.yaml
  stage_actions: [stage_001, stage_002]

metadata:
  experiment: l4_model_planner_policy_recovery_graph
  level: L4
  status: candidate
  task_family: region_place
  initial_plan_authority: structured_recovery_graph_only
  known_failure_recovery_source: formal_offline_policy
  unknown_failure_authority: structured_recovery_graph_only
  arbitrary_model_robot_code: false
  expected_model_fallback_requests_max: 1
