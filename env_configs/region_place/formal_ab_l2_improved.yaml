env:
  _target_: capx.envs.tasks.franka.franka_region_place.FrankaRegionPlaceCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_bin_place_low_level
    low_level_kwargs:
      cube_half_sizes: 0.02,0.02,0.02
      max_steps: 3200
      scenario_sweep: true
      workspace_edge_sweep: true
      target_mode: region
      world_state_source: camera_rgbd
      inject_primary_release_failures: 2
      primary_release_fault_offset: 0.06
    privileged: false
    enable_render: true
    apis: [FrankaControlApi]
    multi_turn_prompt: |
      The formal offline region-place recovery failed its K=3 postcondition.
      Never write robot code. Return REGENERATE followed by exactly one fenced
      python block containing only a literal selector for template
      bin_place_regrasp_replace_v1 with grasp_mode in sample_grasp_pose,
      yaw_topdown, boundary_yaw_topdown; approach_clearance in 0.08, 0.10,
      0.12; lift_clearance in 0.15, 0.18; entry_clearance in 0.08, 0.10,
      0.12; and pregrasp_home as True or False. Use only the image, hard stage
      result, and nonprivileged K=3 state. Return FINISH only when
      task_completed is explicitly true.

api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1
    checkpoint_path: ${oc.env:SAM3_CHECKPOINT,./checkpoints/sam3.pt}
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
use_visual_feedback: true
use_legacy_multi_turn_decision_prompt: false
save_multiturn_prompts: true
trials: 50
num_workers: 1
max_trial_retries: 1
trial_timeout_seconds: 1000
output_dir: ${oc.env:REGION_PLACE_OUTPUT_DIR,./outputs/formal_region_ab_improved/l2}

world_state_recorder:
  enabled: true
  record_every_n_sim_steps: 10
  record_rgb: false
  record_depth: false
  compress_arrays: true

execution_guard:
  enabled: true
  reject_empty_code: true
  max_robot_api_calls_per_block: 12
  max_expensive_loop_iterations: 0
  finish_requires_task_completed: true
  max_decision_reprompts: 0

text_world_state_feedback:
  enabled: true
  window_size: 3
  min_stable_fraction: 0.6667
  numeric_abs_tolerance: 0.015
  numeric_rel_tolerance: 0.05
  include_entities: false
  fail_open: false
  loop_guard_enabled: true
  max_same_failure_retries: 1
  min_progress_delta: 0.01
  action_aligned_window: true
  wait_for_stability: true
  stability_wait_steps: 5
  sample_sim_steps: 3

hybrid_recovery:
  enabled: true
  policy_first: true
  max_model_fallbacks_per_exception: 1
  max_model_fallbacks_total: 1
  model_recovery_stage_indices: [0, 1]
  model_recovery_template: bin_place_regrasp_replace_v1
  model_recovery_candidate_limit: 2
  min_remaining_sim_steps_before_regrasp: 320
  policy_preconditions:
    target_observation_ready: true
    workspace_reachable: true
    target_region_policy_eligible: true
    target_region_clear: true
  task_graph: env_configs/region_place/offline_task_graph.yaml
  recovery_library: env_configs/region_place/formal_ab_improved_recovery_library.yaml
  stage_actions: [stage_001, stage_002]

metadata:
  experiment: formal_region_place_levels_ab_improved
  level: L2
  baseline_parent: formal_ab_l2
  change: k3_recheck_and_bounded_second_template_candidate
  seeds: 21-50
  fault: double_release
  model_authority: bounded_template_selector
  expected_infeasible_seeds: [30, 40, 50]
  expected_model_requests_per_trial_max: 1
