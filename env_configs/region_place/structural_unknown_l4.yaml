env:
  _target_: capx.envs.tasks.franka.franka_region_place.FrankaRegionPlaceCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_bin_place_low_level
    low_level_kwargs:
      cube_half_sizes: 0.02,0.02,0.02
      max_steps: 3200
      scenario_sweep: true
      object_shape: cuboid
      target_mode: region
      world_state_source: camera_rgbd
      recovery_checkpoint_dir: ${oc.env:STRUCTURAL_UNKNOWN_CHECKPOINT_DIR,./outputs/structural_unknown_ab/checkpoints}
      recovery_checkpoint_required: true
    privileged: false
    enable_render: true
    apis: [FrankaMultiObjectSortRgbdApi]
    prompt: |
      Recover the region-place task from the supplied failed checkpoint.
      The initial request may not contain checkpoint coordinates. Do not
      invent them: reobserve_object and reobserve_target read live RGB-D state
      when the compiled plan executes. Return exactly one JSON object with
      only version="recovery_graph_v1" and steps, with no markdown, prose,
      robot code, status, or explanation. Steps must be optional safe_home,
      then reobserve_object, sample_grasp, regrasp, reobserve_target,
      replace, verify. Each step has only skill except: sample_grasp also
      has mode (sample_grasp_pose, yaw_topdown, boundary_yaw_topdown, or
      orthogonal_cuboid); regrasp also has approach_clearance (0.08, 0.10,
      or 0.12) and lift_clearance (0.15 or 0.18); replace also has
      entry_clearance (0.08, 0.10, or 0.12). The local compiler owns all
      robot-control code. Output the graph even if geometry is not yet known.
    multi_turn_prompt: |
      Use the image, hard execution result, and nonprivileged RGB-D K=3 state.
      Known failures are handled by the formal offline strategy library.
      Unknown or failed-policy recovery accepts only recovery_graph_v1 and
      bounded parameters. Return FINISH only when task_completed is true.

api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1
    checkpoint_path: ${oc.env:SAM3_CHECKPOINT,./checkpoints/sam3.pt}
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
use_visual_feedback: true
use_legacy_multi_turn_decision_prompt: false
save_multiturn_prompts: true
trials: 350
num_workers: 1
max_trial_retries: 1
trial_timeout_seconds: 1000
max_model_requests_per_trial: 5
output_dir: ${oc.env:REGION_PLACE_OUTPUT_DIR,./outputs/structural_unknown_ab/l4}

world_state_recorder:
  enabled: true
  record_every_n_sim_steps: 10
  record_rgb: false
  record_depth: false
  compress_arrays: true

execution_guard:
  enabled: true
  reject_empty_code: true
  max_robot_api_calls_per_block: 12
  max_expensive_loop_iterations: 0
  finish_requires_task_completed: true
  max_decision_reprompts: 2

text_world_state_feedback:
  enabled: true
  window_size: 3
  min_stable_fraction: 0.6667
  numeric_abs_tolerance: 0.015
  numeric_rel_tolerance: 0.05
  include_entities: false
  fail_open: false
  loop_guard_enabled: true
  max_same_failure_retries: 2
  min_progress_delta: 0.01
  action_aligned_window: true
  wait_for_stability: true
  stability_wait_steps: 5
  sample_sim_steps: 3

hybrid_recovery:
  enabled: true
  policy_first: false
  model_led_policy_recovery: true
  max_model_fallbacks_per_exception: 1
  max_model_fallbacks_total: 1
  model_initial_plan_template: recovery_graph_v1
  model_recovery_stage_indices: [0, 1]
  model_recovery_template: recovery_graph_v1
  model_recovery_candidate_limit: 2
  min_remaining_sim_steps_before_regrasp: 320
  policy_preconditions:
    target_observation_ready: true
    workspace_reachable: true
    target_region_policy_eligible: true
    target_region_clear: true
  task_graph: env_configs/region_place/offline_task_graph.yaml
  recovery_library: env_configs/region_place/formal_ab_improved_recovery_library.yaml
  stage_actions: [stage_001, stage_002]

metadata:
  experiment: structural_unknown_region_place_same_checkpoint_ab
  level: L4_model_plan_policy_recovery_graph
  seed_range: 301-305
  model_authority: structured_recovery_graph_and_bounded_parameters_only
  arbitrary_model_robot_code: false
  model_request_cap: 5
