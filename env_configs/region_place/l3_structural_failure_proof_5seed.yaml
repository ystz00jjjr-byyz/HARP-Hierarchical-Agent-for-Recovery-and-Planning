env:
  _target_: capx.envs.tasks.franka.franka_region_place.FrankaRegionPlaceCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_bin_place_low_level
    low_level_kwargs:
      cube_half_sizes: 0.02,0.02,0.02
      max_steps: 3200
      scenario_sweep: true
      target_mode: region
      inject_primary_release_failures: 2
    privileged: true
    enable_render: true
    apis: [FrankaControlPrivilegedApi]
    multi_turn_prompt: |
      The formal STRUCTURALLY_DISTINCT_REGRASP_REPLACE policy passed its
      preconditions but failed its K=3 postcondition. Use the image, hard stage
      result, and K=3 world state to recover the task. You may write one short
      executable Python robot-control block using only the provided APIs.
      Reobserve primary and the current target region before acting. Do not use
      loops, hidden simulator state, or repeated retries. Return REGENERATE and
      exactly one fenced Python block. Return FINISH only when task_completed
      is explicitly true.

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
use_visual_feedback: true
use_legacy_multi_turn_decision_prompt: false
save_multiturn_prompts: true
trials: 205
num_workers: 1
max_trial_retries: 1
trial_timeout_seconds: 1000
output_dir: ${oc.env:REGION_PLACE_OUTPUT_DIR}

world_state_recorder:
  enabled: true
  record_every_n_sim_steps: 10
  record_rgb: false
  record_depth: false
  compress_arrays: true

execution_guard:
  enabled: true
  reject_empty_code: true
  max_robot_api_calls_per_block: 12
  max_expensive_loop_iterations: 0
  finish_requires_task_completed: true
  max_decision_reprompts: 1
  stage_expectations:
    - name: primary_grasped
      required:
        target_grasped: true
        object_lifted: true
        wrong_object_grasped: false
    - name: primary_inside_region
      required:
        object_inside_target_region: true
        task_completed: true
        gripper_open: true
        object_stable: true

text_world_state_feedback:
  enabled: true
  window_size: 3
  min_stable_fraction: 0.6667
  numeric_abs_tolerance: 0.015
  numeric_rel_tolerance: 0.05
  include_entities: false
  fail_open: false
  loop_guard_enabled: true
  max_same_failure_retries: 1
  min_progress_delta: 0.01
  action_aligned_window: true
  wait_for_stability: true
  stability_wait_steps: 5
  sample_sim_steps: 3

hybrid_recovery:
  enabled: true
  policy_first: true
  max_model_fallbacks_per_exception: 1
  max_model_fallbacks_total: 1
  min_remaining_sim_steps_before_regrasp: 320
  policy_preconditions:
    target_region_policy_eligible: true
    target_region_clear: true
  task_graph: env_configs/region_place/offline_task_graph.yaml
  recovery_library: env_configs/region_place/candidate_structural_recovery_library.yaml
  stage_actions: [stage_001, stage_002]

metadata:
  status: real_model_fallback_proof
  task_family: region_place
  fallback_level: L3
  model_authority: one_guarded_free_code_block
  seeds: [201, 202, 203, 204, 205]
  expected_model_requests_per_trial_max: 1
  expected_sequence:
    - nominal_release_failure
    - candidate_structurally_distinct_regrasp_replace
    - candidate_release_failure
    - l3_free_code_fallback
    - completion_or_budget_safe_stop
