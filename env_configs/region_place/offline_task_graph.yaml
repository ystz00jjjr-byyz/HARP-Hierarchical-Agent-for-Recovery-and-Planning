  - id: candidate_structurally_distinct_regrasp_replace
    primitive: structurally_distinct_regrasp_replace
    code: |
      import numpy as np

      open_gripper()
      home_pose()

      primary_pos, _, primary_extent = get_object_pose("primary", return_bbox_extent=True)
      target_center, target_extent, target_surface_z = get_target_region("target")
      grasp_pos, grasp_quat = sample_grasp_pose("primary")

      approach = max(0.10, 2.5 * float(primary_extent[2]))
      lift = max(0.18, 4.0 * float(primary_extent[2]))
      entry = max(
          0.10,
          2.5 * float(primary_extent[2]),
          0.10 * float(np.min(target_extent[:2])),
      )
      goto_pose(grasp_pos, grasp_quat, z_approach=approach)
      close_gripper()
      goto_pose(grasp_pos + np.array([0.0, 0.0, lift]), grasp_quat)

      grasp_offset = grasp_pos - primary_pos
      target_object_center = np.asarray(target_center, dtype=float).copy()
      target_object_center[2] = (
          float(target_surface_z) + 0.5 * float(primary_extent[2])
      )
      target_gripper = target_object_center + grasp_offset
      goto_pose(target_gripper, grasp_quat, z_approach=entry)
      open_gripper()
      goto_pose(target_gripper + np.array([0.0, 0.0, entry]), grasp_quat)
    preconditions:
      object_observation_ready: true
      target_observation_ready: true
      workspace_reachable: true
      target_region_policy_eligible: true
      target_region_clear: true
    success_conditions:
