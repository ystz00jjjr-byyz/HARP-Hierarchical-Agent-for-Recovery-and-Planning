initial: [stage_001]
actions:
  - id: stage_001
    primitive: acquire_primary
    parameters:
      primary_pose: cube_poses_robot_base.primary
      primary_extent: cube_extents_robot_base.primary
    code: |
      import numpy as np

      primary_pose = np.asarray(_offline_params["primary_pose"], dtype=float)
      primary_extent = np.asarray(_offline_params["primary_extent"], dtype=float)
      primary_pos = primary_pose[:3]
      primary_quat = primary_pose[3:7]
      w, x, y, z = primary_quat / np.linalg.norm(primary_quat)
      yaw = np.arctan2(2.0 * (w * z + x * y), 1.0 - 2.0 * (y * y + z * z))
      grasp_pos = primary_pos.copy()
      grasp_quat = (
          np.array([0.0, 0.0, 1.0, 0.0])
          if float(np.max(primary_extent[:2]) / np.min(primary_extent[:2])) < 1.6
          else np.array([0.0, -np.sin(0.5 * yaw), np.cos(0.5 * yaw), 0.0])
      )
      approach = max(0.08, 2.0 * float(primary_extent[2]))
      lift = max(0.15, 3.0 * float(primary_extent[2]))
      goto_pose(grasp_pos, grasp_quat, z_approach=approach)
      close_gripper()
      goto_pose(grasp_pos + np.array([0.0, 0.0, lift]), grasp_quat)
    preconditions:
      target_region_policy_eligible: true
      target_region_clear: true
    success_conditions:
      target_grasped: true
      object_lifted: true
      wrong_object_grasped: false
    failure_routes:
      PRECONDITION_FAILED: TARGET_REGION_BLOCKED
      POSTCONDITION_FAILED: GRASP_MISS
      SANDBOX_ERROR: GRASP_MISS
    next: stage_002
    metadata:
      precondition_failure_next_action: recover_budget_safe_stop

  - id: stage_002
    primitive: place_primary_in_target_region
    code: |
      target_center, target_extent, target_surface_z = get_target_region("target")
      target_object_center = target_center.copy()
      target_object_center[2] = target_surface_z + 0.5 * float(primary_extent[2])
      target_gripper = target_object_center + (grasp_pos - primary_pos)
      entry = target_gripper.copy()
      entry[2] += approach
      transfer = np.array([0.58, 0.0, max(float(entry[2]), 0.12)])
      goto_pose(transfer, grasp_quat)
      goto_pose(entry, grasp_quat)
      goto_pose(target_gripper, grasp_quat)
      open_gripper()
      goto_pose(entry, grasp_quat)
      goto_pose(transfer, grasp_quat)
    preconditions:
      target_grasped: true
      object_lifted: true
      target_region_policy_eligible: true
      target_region_clear: true
    success_conditions:
      object_inside_target_region: true
      task_completed: true
      gripper_open: true
      object_stable: true
    failure_routes:
