env:
  _target_: capx.envs.tasks.franka.franka_region_place.FrankaRegionPlaceCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_bin_place_low_level
    low_level_kwargs:
      cube_half_sizes: 0.02,0.02,0.02
      max_steps: 2200
      scenario_sweep: true
      workspace_edge_sweep: ${oc.env:REGION_PLACE_WORKSPACE_EDGE_SWEEP,false}
      boundary_just_fit: ${oc.env:REGION_PLACE_BOUNDARY_JUST_FIT,false}
      target_mode: region
      inject_grasp_miss_attempts: ${oc.env:REGION_PLACE_GRASP_MISS_ATTEMPTS,null}
      inject_primary_release_failures: ${oc.env:REGION_PLACE_RELEASE_FAILURES,1}
    privileged: true
    enable_render: true
    apis: [FrankaControlPrivilegedApi]
    multi_turn_prompt: |
      Both bounded offline regrasp candidates failed. Use the image, hard
      stage result, and K=3 world state. Never write robot code. Return
      REGENERATE followed by exactly one fenced python block containing only:
      {{"template": "bin_place_regrasp_replace_v1",
       "grasp_mode": "sample_grasp_pose", "yaw_topdown", or "boundary_yaw_topdown",
       "approach_clearance": one of 0.08, 0.10, 0.12,
       "lift_clearance": one of 0.15, 0.18,
       "entry_clearance": one of 0.08, 0.10, 0.12,
       "pregrasp_home": True or False}}
      Return FINISH only when task_completed is explicitly true.

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
use_visual_feedback: true
use_legacy_multi_turn_decision_prompt: false
save_multiturn_prompts: true
trials: 23
num_workers: 1
max_trial_retries: 1
trial_timeout_seconds: 1000
output_dir: ${oc.env:REGION_PLACE_OUTPUT_DIR}

world_state_recorder:
  enabled: true
  record_every_n_sim_steps: 10
  record_rgb: false
  record_depth: false
  compress_arrays: true

execution_guard:
  enabled: true
  reject_empty_code: true
  max_robot_api_calls_per_block: 9
  max_expensive_loop_iterations: 0
  finish_requires_task_completed: true
  max_decision_reprompts: 1
  stage_expectations:
    - name: primary_grasped
      required:
        target_grasped: true
        object_lifted: true
        wrong_object_grasped: false
    - name: primary_inside_region
      required:
        object_inside_target_region: true
        task_completed: true
        gripper_open: true
        object_stable: true

text_world_state_feedback:
  enabled: true
  window_size: 3
  min_stable_fraction: 0.6667
  numeric_abs_tolerance: 0.015
  numeric_rel_tolerance: 0.05
  include_entities: false
  fail_open: false
  loop_guard_enabled: true
  max_same_failure_retries: 2
  min_progress_delta: 0.01
  action_aligned_window: true
  wait_for_stability: true
  stability_wait_steps: 5
  sample_sim_steps: 3

hybrid_recovery:
  enabled: true
  policy_first: true
  max_model_fallbacks_per_exception: 1
  max_model_fallbacks_total: 1
  model_recovery_stage_indices: [0, 1]
  model_recovery_template: bin_place_regrasp_replace_v1
  min_remaining_sim_steps_before_regrasp: 320
  policy_preconditions:
    target_region_policy_eligible: true
    target_region_clear: true
  task_graph: env_configs/region_place/offline_task_graph.yaml
  recovery_library: env_configs/region_place/recovery_library.yaml
  stage_actions: [stage_001, stage_002]

metadata:
  status: fallback_proof
  task_family: region_place
  seed: 23
  expected_sequence:
    - recover_target_region_regrasp
    - recover_target_region_regrasp_retry
    - candidate_structurally_distinct_regrasp_replace
    - l2_template_fallback
  baseline_result_before_structural_candidate:
    offline_candidates_failed: 2
    l2_requests: 1
    l2_tokens: 4530
    l2_response_seconds: 12.018388
    task_completed: false
    budget_safe_stop_completed: true
