env:
  _target_: capx.envs.tasks.franka.franka_cube_restack.FrankaRestackCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_cubes_restack_low_level
    low_level_kwargs:
      object_shape: cuboid
      cube_A_half_sizes: ${oc.env:CUBOID_HALF_SIZES}
      cube_B_half_sizes: ${oc.env:CUBOID_HALF_SIZES}
      primary_color: red
      secondary_color: green
    privileged: false
    apis: [FrankaControlApi]
    prompt: |
      You are controlling a Franka Emika robot. Initially the secondary cuboid
      is on top of the primary cuboid. Goal: gently place the primary cuboid on
      the secondary cuboid and open the gripper. Use the live object extents and
      grasp planner result; do not assume a fixed size or orientation.
    multi_turn_prompt: |
      The offline cuboid policy was attempted before this request. The following
      code blocks were executed:
      ```python
      {executed_code}
      ```
      Console stdout:
      ```
      {console_stdout}
      ```
      Console stderr:
      ```
      {console_stderr}
      ```
      The hard stage result and K=3 world state are authoritative. Respond with
      REGENERATE and one short recovery stage in a Python code fence. Use live
      extents and current poses. FINISH only when task_completed is explicitly true.

api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1
    checkpoint_path: ${oc.env:SAM3_CHECKPOINT,./checkpoints/sam3.pt}
  - _target_: capx.serving.launch_contact_graspnet_server.main
    port: 8115
    host: 127.0.0.1
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

record_video: true
use_visual_feedback: true
use_legacy_multi_turn_decision_prompt: false
save_multiturn_prompts: true
trials: 10
num_workers: 1
max_trial_retries: 1
trial_timeout_seconds: 1000
output_dir: ${oc.env:CUBOID_OUTPUT_DIR}

world_state_recorder:
  enabled: true
  record_every_n_sim_steps: 10
  record_rgb: false
  record_depth: false
  compress_arrays: true

execution_guard:
  enabled: true
  reject_empty_code: true
  max_robot_api_calls_per_block: 8
  max_expensive_loop_iterations: 0
  finish_requires_task_completed: true
  max_decision_reprompts: 2
  stage_expectations:
    - name: secondary_cuboid_cleared
      required:
        restack_precondition_cleared: true
        gripper_open: true
        object_stable: true
    - name: primary_cuboid_grasped
      required:
        target_grasped: true
        object_lifted: true
        wrong_object_grasped: false
    - name: primary_cuboid_stacked
      required:
        task_completed: true
        gripper_open: true
        object_stable: true

text_world_state_feedback:
  enabled: true
  window_size: 3
  min_stable_fraction: 0.6667
  numeric_abs_tolerance: 0.01
  numeric_rel_tolerance: 0.05
  include_entities: true
  fail_open: false
  loop_guard_enabled: true
  max_same_failure_retries: 2
  min_progress_delta: 0.01
  action_aligned_window: true
  wait_for_stability: true
  stability_wait_steps: 20
  sample_sim_steps: 3

hybrid_recovery:
  enabled: true
  policy_first: true
  policy_preconditions:
    geometry_policy_eligible: true
    primary_gripper_feasible: true
    secondary_gripper_feasible: true
    stack_support_feasible: true
  task_graph: env_configs/cube_restack/offline_task_graph.yaml
  action_library: env_configs/cube_restack/cuboid_slender_candidate_actions.yaml
  recovery_library: env_configs/cube_restack/cuboid_slender_candidate_recovery.yaml
  stage_actions: [stage_001, stage_002, stage_003]
