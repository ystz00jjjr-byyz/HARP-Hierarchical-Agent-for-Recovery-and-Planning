env:
  _target_: capx.envs.tasks.franka.franka_multi_object_sort.FrankaMultiObjectSortCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_multi_object_sort_low_level
    low_level_kwargs:
      max_steps: 3200
      cube_A_half_sizes: 0.015,0.025,0.020
      cube_B_half_sizes: 0.018,0.028,0.020
      primary_color: red
      secondary_color: green
      object_shape: cuboid
      world_state_source: camera_rgbd
      inject_primary_release_failures: 0
      inject_grasp_miss_attempts: 1
      directed_primary_source_x: 0.185
    privileged: false
    enable_render: true
    apis: [FrankaMultiObjectSortRgbdApi]
    prompt: |
      Supervise the trusted cuboid edge-recovery graph. A false direct
      workspace_reachable flag is expected for this task and is not by itself
      infeasible. When workspace_edge_recovery_required and
      workspace_edge_recovery_feasible are true, choose EXECUTE: the graph
      performs its own IK, joint-limit, self-collision, and object-path gate
      before one bounded inward push. Choose SAFE_STOP only when the K=3 state
      marks the edge recovery infeasible or another explicit safety gate fails.
    multi_turn_prompt: |
      The formal cuboid edge-push policy failed its K=3 postcondition. Return
      exactly one raw JSON object with this schema:
      {{"template":"bin_place_regrasp_replace_v1",
       "grasp_mode":"sample_grasp_pose", "approach_clearance":0.10,
       "lift_clearance":0.15, "entry_clearance":0.10,
       "pregrasp_home":true}}
      grasp_mode may also be yaw_topdown or boundary_yaw_topdown; clearances
      must use the allowed discrete values. Never return robot code or markdown.

api_servers:
  - _target_: capx.serving.openrouter_server.main
    key_file: /home/byyz/桌面/api key.md
    port: 8110
    host: 127.0.0.1
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

use_oracle_code: true
record_video: true
use_visual_feedback: true
use_legacy_multi_turn_decision_prompt: false
save_multiturn_prompts: true
trials: 23
num_workers: 1
max_trial_retries: 1
trial_timeout_seconds: 1000
output_dir: ${oc.env:SORT_OUTPUT_DIR,./outputs/multi_object_sort_cuboid_edge_push_l2_unseen}

world_state_recorder:
  enabled: true
  record_every_n_sim_steps: 10
  record_rgb: false
  record_depth: false
  compress_arrays: true

execution_guard:
  enabled: true
  reject_empty_code: true
  max_robot_api_calls_per_block: 20
  max_expensive_loop_iterations: 0
  finish_requires_task_completed: true
  max_decision_reprompts: 1

text_world_state_feedback:
  enabled: true
  window_size: 3
  min_stable_fraction: 0.6667
  numeric_abs_tolerance: 0.015
  numeric_rel_tolerance: 0.05
  include_entities: false
  fail_open: false
  loop_guard_enabled: true
  max_same_failure_retries: 1
  min_progress_delta: 0.01
  action_aligned_window: true
  wait_for_stability: true
  stability_wait_steps: 5
  sample_sim_steps: 3

hybrid_recovery:
  enabled: true
  policy_first: true
  max_model_fallbacks_per_exception: 1
  max_model_fallbacks_total: 1
  model_recovery_stage_indices: [0, 1]
  model_recovery_template: bin_place_regrasp_replace_v1
  model_recovery_candidate_limit: 1
  min_remaining_sim_steps_before_regrasp: 320
  task_graph: env_configs/multi_object_sort/cuboid_edge_push_candidate_graph.yaml
  recovery_library: env_configs/multi_object_sort/cuboid_edge_push_candidate_library.yaml
  stage_actions:
    - candidate_edge_push_margin_gate
    - candidate_controlled_edge_push
    - candidate_post_push_reobserve
    - candidate_finish_remaining_sort
  l2_model_participation:
    enabled: true
    max_requests: 3
    review_after_actions: [candidate_controlled_edge_push]
    final_review: true

metadata:
  status: paired_unseen
  level: L2
  seeds: 21-23
  model_authority: bounded_task_graph_supervisor
  expected_model_requests_per_trial_max: 3
