env:
  _target_: capx.envs.tasks.franka.franka_multi_object_sort.FrankaThreeObjectSortCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_multi_object_sort_low_level
    low_level_kwargs:
      max_steps: 4800
      cube_A_half_sizes: 0.015,0.025,0.020
      cube_B_half_sizes: 0.018,0.028,0.020
      primary_color: red
      secondary_color: green
      object_shape: cuboid
      include_tertiary: true
      world_state_source: camera_rgbd
      inject_primary_release_failures: 0
      inject_grasp_miss_attempts: 0
    privileged: false
    enable_render: true
    apis: [FrankaMultiObjectSortRgbdApi]
    prompt: |
      Sort three objects by role: primary to target_primary, secondary to
      target_secondary, and tertiary to target_tertiary. Use live observations
      and only the provided robot APIs. Return one executable Python block,
      use no loops or hidden simulator state, and finish at home with the
      gripper open.
    multi_turn_prompt: |
      Use the image, hard stage result, and nonprivileged K=3 state. The local
      candidate policy handles known incomplete-sort recovery first. Only if
      that policy fails, return one raw JSON object with this schema:
      {{"template":"bin_place_regrasp_replace_v1",
       "grasp_mode":"sample_grasp_pose", "approach_clearance":0.10,
       "lift_clearance":0.15, "entry_clearance":0.10,
       "pregrasp_home":true}}
      Never return executable recovery code or markdown. Return FINISH only
      when task_completed is explicitly true.

api_servers:
  - _target_: capx.serving.openrouter_server.main
    key_file: /home/byyz/桌面/api key.md
    port: 8110
    host: 127.0.0.1
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

use_oracle_code: false
record_video: true
use_visual_feedback: true
use_legacy_multi_turn_decision_prompt: false
save_multiturn_prompts: true
trials: 35
num_workers: 1
max_trial_retries: 1
trial_timeout_seconds: 1200
output_dir: ${oc.env:SORT_OUTPUT_DIR,./outputs/three_object_sort_l3_smoke}

world_state_recorder:
  enabled: true
  record_every_n_sim_steps: 10
  record_rgb: false
  record_depth: false
  compress_arrays: true

execution_guard:
  enabled: true
  reject_empty_code: true
  max_robot_api_calls_per_block: 40
  max_expensive_loop_iterations: 0
  finish_requires_task_completed: true
  max_decision_reprompts: 1

text_world_state_feedback:
  enabled: true
  window_size: 3
  min_stable_fraction: 0.6667
  numeric_abs_tolerance: 0.015
  numeric_rel_tolerance: 0.05
  include_entities: false
  fail_open: false
  loop_guard_enabled: true
  max_same_failure_retries: 1
  min_progress_delta: 0.01
  action_aligned_window: true
  wait_for_stability: true
  stability_wait_steps: 5
  sample_sim_steps: 3

hybrid_recovery:
  enabled: true
  policy_first: false
  model_led_policy_recovery: true
  max_model_fallbacks_per_exception: 1
  max_model_fallbacks_total: 1
  model_recovery_stage_indices: [0, 1]
  model_recovery_template: bin_place_regrasp_replace_v1
  model_recovery_candidate_limit: 1
  min_remaining_sim_steps_before_regrasp: 420
  task_graph: env_configs/multi_object_sort/three_object_l3_graph.yaml
  recovery_library: env_configs/multi_object_sort/three_object_l3_library.yaml
  stage_actions: [stage_001]

metadata:
  status: candidate_smoke
  level: L3
  seeds: 31-35
  acceptance: 4/5
  initial_plan_source: model
  known_failure_recovery_source: candidate_policy
  model_recovery_authority: structured_plan_only
  expected_model_recovery_requests_per_trial_max: 1
