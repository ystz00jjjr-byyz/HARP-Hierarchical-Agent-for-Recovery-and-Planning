env:
  _target_: capx.envs.tasks.franka.franka_multi_object_sort.FrankaFourObjectSortCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_multi_object_sort_low_level
    low_level_kwargs:
      max_steps: 6200
      cube_A_half_sizes: 0.015,0.025,0.020
      cube_B_half_sizes: 0.018,0.028,0.020
      primary_color: red
      secondary_color: green
      object_shape: cuboid
      include_tertiary: true
      include_quaternary: true
      world_state_source: camera_rgbd
      inject_primary_release_failures: 0
      inject_grasp_miss_attempts: 0
    privileged: false
    enable_render: true
    apis: [FrankaMultiObjectSortRgbdApi]
    prompt: |
      Sort four objects by role into target_primary, target_secondary,
      target_tertiary, and target_quaternary. Use live observations and only
      the provided robot APIs. Return one executable Python block, use no
      loops or hidden simulator state, and finish at home with the gripper open.
      These targets are planar regions, not containers: do not add rim height
      or an arbitrary vertical release offset. For each role, read the object
      center and extent, sample its grasp, and preserve the live grasp offset
      when placing: place_gripper = target_center + (grasp - object_center).
      After closing, first lift vertically by 0.15 m. Approach each placement
      from at least 0.08 m above, descend to place_gripper, release, and retreat
      vertically before starting the next role. Never drag a grasped object
      laterally across the table.
    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      Console stdout:
      ```
      {console_stdout}
      ```
      Console stderr:
      ```
      {console_stderr}
      ```
      Respond with exactly one:
      - REGENERATE followed by new Python code in a fenced code block.
      - FINISH if the task appears complete.

api_servers:
  - _target_: capx.serving.openrouter_server.main
    key_file: /home/byyz/桌面/api key.md
    port: 8110
    host: 127.0.0.1
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

use_oracle_code: false
record_video: true
use_visual_feedback: true
use_legacy_multi_turn_decision_prompt: false
save_multiturn_prompts: true
trials: 86
resume_idx: 84
num_workers: 1
max_trial_retries: 1
trial_timeout_seconds: 1200
max_model_requests_per_trial: 5
output_dir: ${oc.env:SORT_OUTPUT_DIR,./outputs/four_object_native_paired_cap5_seeds_84_86}

world_state_recorder:
  enabled: true
  record_every_n_sim_steps: 10
  record_rgb: false
  record_depth: false
  compress_arrays: true

text_world_state_feedback:
  enabled: false

metadata:
  status: paired_ab
  level: native_capx
  seeds: 84-86
  model_request_limit_per_trial: 5
  recovery_source: unrestricted_model_regeneration
  offline_policy_enabled: false
  k3_feedback_enabled: false
