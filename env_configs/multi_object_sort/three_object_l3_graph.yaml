      tertiary_target, _, _ = get_target_region("target_tertiary")
      tertiary_depth = float(np.clip(0.20 * tertiary_extent[2], 0.004, 0.008))
      tertiary_place = tertiary_target + np.array([0.0, 0.0, -tertiary_depth])
      goto_pose(tertiary_place + np.array([0.0, 0.0, tertiary_clearance]), tertiary_quat)
      goto_pose(tertiary_place, tertiary_quat)
      open_gripper()
      goto_pose(tertiary_place + np.array([0.0, 0.0, tertiary_clearance]), tertiary_quat)
