metadata:
  status: formal
  task_family: multi_object_sort
  candidate: four_role_sequential_finish_v1
  max_attempts_per_action: 1
  promotion_gate: {smoke_minimum_successes: 4, smoke_trials: 5, unseen_minimum_successes: 8, unseen_trials: 10}
  validation:
    promoted_at: 2026-10-09
    smoke: {seeds: 61-65, task_completed: 5, trials: 5}
    unseen: {seeds: 71-80, task_completed: 9, trials: 10}
    unseen_outcomes: {direct_success: 6, policy_recovery_success: 3, safe_stop: 1}
    known_residual_failure: seed_79_secondary_replace

initial: [stage_001]

actions:
  - id: stage_001
    primitive: model_generated_four_object_sort
    code: "pass"
    success_conditions: {task_completed: true}
    failure_routes:
      POSTCONDITION_FAILED: FOUR_OBJECT_SORT_INCOMPLETE
      SANDBOX_ERROR: FOUR_OBJECT_SORT_INCOMPLETE

  - id: candidate_grasp_primary
    primitive: rgbd_regrasp_primary
    code: |
      import numpy as np
      primary_pos, _, primary_extent = get_object_pose("primary", return_bbox_extent=True)
      primary_grasp, primary_quat = sample_grasp_pose("primary")
      primary_clearance = max(0.08, 2.0 * float(primary_extent[2]))
      goto_pose(primary_grasp, primary_quat, z_approach=primary_clearance)
      close_gripper()
      goto_pose(primary_grasp + np.array([0.0, 0.0, 0.15]), primary_quat)
    success_conditions: {active_grasp_role: primary, target_grasped: true, object_lifted: true, wrong_object_grasped: false}
    next: candidate_replace_primary
    metadata: &bounded_primary
      status: formal
      skip_if_conditions: {objects_at_targets.primary: true}
      observation_refresh: true
      interrupt_on_failure: true
      max_attempts: 1
      failure_next_action: recover_budget_safe_stop

  - id: candidate_replace_primary
    primitive: rgbd_replace_primary
    code: |
      import numpy as np
      primary_target, _, _ = get_target_region("target_primary")
      primary_xy_offset = np.clip(primary_grasp[:2] - primary_pos[:2], -0.01, 0.01)
      primary_depth = float(np.clip(0.20 * primary_extent[2], 0.004, 0.008))
      primary_place = primary_target + np.array([primary_xy_offset[0], primary_xy_offset[1], -primary_depth])
      goto_pose(primary_place + np.array([0.0, 0.0, primary_clearance]), primary_quat)
      goto_pose(primary_place, primary_quat)
      open_gripper()
      goto_pose(primary_place + np.array([0.0, 0.0, primary_clearance]), primary_quat)
      home_pose()
    success_conditions: {objects_at_targets.primary: true, gripper_open: true, object_stable: true}
    next: candidate_grasp_secondary
    metadata: *bounded_primary

  - id: candidate_grasp_secondary
    primitive: rgbd_regrasp_secondary
