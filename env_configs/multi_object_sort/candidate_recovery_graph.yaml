initial: [stage_001]

actions:
  - id: stage_001
    primitive: multi_object_sort_nominal
    code: "pass"
    success_conditions:
      task_completed: true
    failure_routes:
      POSTCONDITION_FAILED: SORT_RECOVERY_REQUIRED
      SANDBOX_ERROR: SORT_RECOVERY_REQUIRED

  - id: candidate_role_rebind
    primitive: reobserve_rebind_and_stage_primary
    code: |
      import numpy as np

      home_pose()
      open_gripper()
      rebind_roles()
      staged_primary_pos, _, staged_primary_extent = get_object_pose(
          "primary", return_bbox_extent=True
      )
      staged_primary_grasp, staged_primary_quat = sample_grasp_pose("primary")
      staged_primary_clearance = max(
          0.08, 2.0 * float(staged_primary_extent[2])
      )
      goto_pose(
          staged_primary_grasp,
          staged_primary_quat,
          z_approach=staged_primary_clearance,
      )
      close_gripper()
      goto_pose(
          staged_primary_grasp + np.array([0.0, 0.0, 0.15]),
          staged_primary_quat,
      )
      staged_primary_target, _, _ = get_target_region("target_primary")
      staged_primary_place = (
          staged_primary_target
          + np.array([-0.24, 0.0, 0.0])
          + (staged_primary_grasp - staged_primary_pos)
      )
      goto_pose(
          staged_primary_place
          + np.array([0.0, 0.0, staged_primary_clearance]),
          staged_primary_quat,
      )
      goto_pose(staged_primary_place, staged_primary_quat)
      open_gripper()
      goto_pose(
          staged_primary_place
          + np.array([0.0, 0.0, staged_primary_clearance]),
          staged_primary_quat,
      )
      home_pose()
    success_conditions:
      wrong_role_binding: false
      object_observation_ready: true
      target_observation_ready: true
    next: candidate_role_place_secondary
    metadata:
      status: formal
      handles_exception: ROLE_BINDING_ERROR
      observation_refresh: true
      interrupt_on_failure: true
      max_attempts: 1
      failure_next_action: recover_budget_safe_stop
      precondition_failure_next_action: recover_budget_safe_stop

  - id: candidate_role_place_secondary
    primitive: replace_secondary_after_role_rebind
    code: |
      import numpy as np

      secondary_pos, _, secondary_extent = get_object_pose(
          "secondary", return_bbox_extent=True
      )
      secondary_grasp, secondary_quat = sample_grasp_pose("secondary")
      secondary_clearance = max(0.08, 2.0 * float(secondary_extent[2]))
      goto_pose(secondary_grasp, secondary_quat, z_approach=secondary_clearance)
      close_gripper()
      goto_pose(secondary_grasp + np.array([0.0, 0.0, 0.15]), secondary_quat)
      secondary_target, _, _ = get_target_region("target_secondary")
      secondary_place = secondary_target + (secondary_grasp - secondary_pos)
      goto_pose(secondary_place + np.array([0.0, 0.0, secondary_clearance]), secondary_quat)
      goto_pose(secondary_place, secondary_quat)
      open_gripper()
      goto_pose(secondary_place + np.array([0.0, 0.0, secondary_clearance]), secondary_quat)
      home_pose()
    success_conditions:
      objects_at_targets.secondary: true
      wrong_role_binding: false
      object_stable: true
    next: candidate_role_place_primary
    metadata:
      status: formal
      handles_exception: ROLE_BINDING_ERROR
      interrupt_on_failure: true
      max_attempts: 1
      failure_next_action: recover_budget_safe_stop
      precondition_failure_next_action: recover_budget_safe_stop

  - id: candidate_role_place_primary
    primitive: replace_primary_after_role_rebind
    code: |
      import numpy as np

      primary_pos, _, primary_extent = get_object_pose(
          "primary", return_bbox_extent=True
      )
      primary_grasp, primary_quat = sample_grasp_pose("primary")
      primary_clearance = max(0.08, 2.0 * float(primary_extent[2]))
      goto_pose(primary_grasp, primary_quat, z_approach=primary_clearance)
      close_gripper()
      goto_pose(primary_grasp + np.array([0.0, 0.0, 0.15]), primary_quat)
      primary_target, _, _ = get_target_region("target_primary")
      primary_place = primary_target + (primary_grasp - primary_pos)
      goto_pose(primary_place + np.array([0.0, 0.0, primary_clearance]), primary_quat)
      goto_pose(primary_place, primary_quat)
      open_gripper()
      goto_pose(primary_place + np.array([0.0, 0.0, primary_clearance]), primary_quat)
      home_pose()
    success_conditions:
      task_completed: true
      gripper_open: true
      object_stable: true
    metadata:
      status: formal
      handles_exception: ROLE_BINDING_ERROR
      interrupt_on_failure: true
      max_attempts: 1
      failure_next_action: recover_budget_safe_stop
      precondition_failure_next_action: recover_budget_safe_stop

  - id: candidate_workspace_reachability_gate
    primitive: workspace_reachability_gate
    code: "pass"
    preconditions:
      object_observation_ready: true
      object_stable: true
      workspace_edge_recovery_feasible: true
    success_conditions:
      object_observation_ready: true
      workspace_edge_recovery_feasible: true
    next: candidate_controlled_workspace_move
    metadata:
      status: formal
      handles_exception: WORKSPACE_EDGE_GRASP_MISS,GRASP_MISS,PLACE_FAILED
      interrupt_on_failure: true
      max_attempts: 1
      failure_next_action: recover_budget_safe_stop
      precondition_failure_next_action: recover_budget_safe_stop

  - id: candidate_controlled_workspace_move
    primitive: controlled_move_primary_into_workspace
    code: |
      import numpy as np

      home_pose()
      open_gripper()
      edge_primary_pos, _, edge_primary_extent = get_object_pose(
          "primary", return_bbox_extent=True
      )
      if edge_primary_pos[0] < 0.44 or edge_primary_pos[0] > 0.74:
          edge_depth = float(np.clip(
              0.30 * edge_primary_extent[2], 0.008, 0.012
          ))
          edge_grasp = edge_primary_pos - np.array([0.0, 0.0, edge_depth])
          edge_quat = np.array([0.0, 0.70710678, 0.70710678, 0.0])
          edge_clearance = max(0.08, 2.0 * float(edge_primary_extent[2]))
          edge_safe_x = 0.50 if edge_primary_pos[0] < 0.44 else 0.56
          goto_pose(edge_grasp, edge_quat, z_approach=edge_clearance)
          close_gripper()
          edge_lifted = edge_grasp + np.array([0.0, 0.0, 0.035])
          goto_pose(edge_lifted, edge_quat)
          edge_moved = edge_lifted.copy()
          edge_moved[0] = edge_safe_x
          goto_pose(edge_moved, edge_quat)
          edge_release = edge_moved - np.array([0.0, 0.0, 0.035])
          goto_pose(edge_release, edge_quat)
          open_gripper()
          goto_pose(edge_moved, edge_quat)
      home_pose()
    success_conditions:
      object_inside_regrasp_workspace: true
      gripper_open: true
      object_stable: true
    next: candidate_workspace_reobserve
    metadata:
      status: formal
      handles_exception: WORKSPACE_EDGE_GRASP_MISS,GRASP_MISS,PLACE_FAILED
      interrupt_on_failure: true
      max_attempts: 1
      failure_next_action: candidate_second_release_reobserve
      precondition_failure_next_action: recover_budget_safe_stop

  - id: candidate_second_release_reobserve
    primitive: reobserve_after_second_release_displacement
    code: |
      home_pose()
      open_gripper()
      get_object_pose("primary", return_bbox_extent=True)
      get_object_pose("secondary", return_bbox_extent=True)
    success_conditions:
      object_observation_ready: true
      measurement_fresh: true
      workspace_edge_recovery_required: true
      workspace_edge_recovery_feasible: true
      object_stable: true
    next: candidate_second_release_displacement
    metadata:
