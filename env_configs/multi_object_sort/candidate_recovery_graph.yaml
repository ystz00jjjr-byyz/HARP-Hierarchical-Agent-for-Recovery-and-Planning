      precondition_failure_next_action: recover_budget_safe_stop

  - id: candidate_second_release_displacement
    primitive: reverse_controlled_move_after_second_release
    code: |
      import numpy as np

      second_pos, _, second_extent = get_object_pose(
          "primary", return_bbox_extent=True
      )
      second_depth = float(np.clip(0.20 * second_extent[2], 0.004, 0.008))
      second_grasp = second_pos - np.array([0.0, 0.0, second_depth])
      second_quat = np.array([0.0, 0.70710678, 0.70710678, 0.0])
      second_clearance = max(0.08, 2.0 * float(second_extent[2]))
      second_safe_x = 0.58 if second_pos[0] < 0.44 else 0.50
      goto_pose(second_grasp, second_quat, z_approach=second_clearance)
      close_gripper()
      second_lifted = second_grasp + np.array([0.0, 0.0, 0.035])
      goto_pose(second_lifted, second_quat)
      second_moved = second_lifted.copy()
      second_moved[0] = second_safe_x
      goto_pose(second_moved, second_quat)
      second_release = second_moved - np.array([0.0, 0.0, 0.035])
      goto_pose(second_release, second_quat)
      open_gripper()
      goto_pose(second_moved, second_quat)
      home_pose()
    preconditions:
      workspace_edge_recovery_required: true
      workspace_edge_recovery_feasible: true
      object_observation_ready: true
    success_conditions:
      object_inside_regrasp_workspace: true
      gripper_open: true
      object_stable: true
    next: candidate_workspace_reobserve
    metadata:
      status: formal
      promoted_on: 2026-10-04
      validated_unseen_seeds: 10
      validated_successes: 8
      handles_exception: SECOND_RELEASE_DISPLACEMENT
      interrupt_on_failure: true
      max_attempts: 1
      failure_next_action: recover_budget_safe_stop
      precondition_failure_next_action: recover_budget_safe_stop

  - id: candidate_workspace_reobserve
    primitive: reobserve_primary_after_workspace_move
    code: |
      home_pose()
      open_gripper()
      get_object_pose("primary", return_bbox_extent=True)
      get_object_pose("secondary", return_bbox_extent=True)
    success_conditions:
      object_observation_ready: true
      measurement_fresh: true
      object_inside_regrasp_workspace: true
      object_stable: true
    next: candidate_primary_regrasp
    metadata:
      status: formal
      handles_exception: WORKSPACE_EDGE_GRASP_MISS,GRASP_MISS,PLACE_FAILED
      observation_refresh: true
      interrupt_on_failure: true
      max_attempts: 1
      failure_next_action: recover_budget_safe_stop
      precondition_failure_next_action: recover_budget_safe_stop

  - id: candidate_primary_regrasp
    primitive: regrasp_primary_from_rgbd
    code: |
      import numpy as np

      home_pose()
      open_gripper()
      recovery_primary_pos, _, recovery_primary_extent = get_object_pose(
          "primary", return_bbox_extent=True
      )
      recovery_grasp, recovery_quat = sample_grasp_pose("primary")
      recovery_clearance = max(0.08, 2.0 * float(recovery_primary_extent[2]))
      goto_pose(recovery_grasp, recovery_quat, z_approach=recovery_clearance)
      close_gripper()
      goto_pose(recovery_grasp + np.array([0.0, 0.0, 0.15]), recovery_quat)
    success_conditions:
      active_grasp_role: primary
      target_grasped: true
      object_lifted: true
      wrong_object_grasped: false
    next: candidate_primary_replace
    metadata:
      status: formal
      handles_exception: WORKSPACE_EDGE_GRASP_MISS,GRASP_MISS,PLACE_FAILED
      interrupt_on_failure: true
      max_attempts: 1
      failure_next_action: recover_budget_safe_stop
      precondition_failure_next_action: recover_budget_safe_stop

  - id: candidate_primary_replace
    primitive: replace_primary_in_target_region
    code: |
      import numpy as np

      recovery_target, _, _ = get_target_region("target_primary")
      recovery_place = recovery_target + (recovery_grasp - recovery_primary_pos)
      goto_pose(
          recovery_place + np.array([0.0, 0.0, recovery_clearance]),
          recovery_quat,
      )
      goto_pose(recovery_place, recovery_quat)
      open_gripper()
      goto_pose(
          recovery_place + np.array([0.0, 0.0, recovery_clearance]),
          recovery_quat,
      )
      home_pose()
    success_conditions:
      task_completed: true
      objects_at_targets.primary: true
      gripper_open: true
      object_stable: true
    metadata:
      status: formal
      handles_exception: WORKSPACE_EDGE_GRASP_MISS,GRASP_MISS,PLACE_FAILED
      interrupt_on_failure: true
      max_attempts: 1
      failure_next_action: recover_budget_safe_stop
      precondition_failure_next_action: recover_budget_safe_stop

  - id: recover_budget_safe_stop
    primitive: recover_budget_safe_stop
    code: |
      home_pose()
      open_gripper()
    success_conditions:
      gripper_open: true
    metadata:
      status: formal
      terminal: safe_stop
      max_attempts: 1
