env:
  _target_: capx.envs.tasks.franka.franka_multi_object_sort.FrankaMultiObjectSortCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_multi_object_sort_low_level
    low_level_kwargs:
      max_steps: 3200
      cube_A_half_sizes: 0.02,0.02,0.02
      cube_B_half_sizes: 0.02,0.02,0.02
      primary_color: red
      secondary_color: green
      object_shape: cube
      world_state_source: camera_rgbd
      inject_role_binding_error: ${oc.env:SORT_ROLE_BINDING_ERROR,false}
      inject_grasp_miss_attempts: ${oc.env:SORT_GRASP_MISS_ATTEMPTS,0}
      inject_primary_release_failures: ${oc.env:SORT_PLACE_FAILURES,0}
      primary_release_fault_offset: ${oc.env:SORT_RELEASE_OFFSET,0.07}
    privileged: false
    enable_render: true
    apis: [FrankaMultiObjectSortRgbdApi]
    multi_turn_prompt: |
      The formal offline multi-object-sort recovery failed its K=3
      postcondition. Return exactly one raw JSON object selecting template
      bin_place_regrasp_replace_v1 with grasp_mode in sample_grasp_pose,
      yaw_topdown, boundary_yaw_topdown; approach_clearance in 0.08, 0.10,
      0.12; lift_clearance in 0.15, 0.18; entry_clearance in 0.08, 0.10,
      0.12; and pregrasp_home as true or false. Do not return robot code,
      markdown, fenced Python, or prose. Return FINISH only when
      task_completed is explicitly true.

api_servers:
  - _target_: capx.serving.openrouter_server.main
    key_file: /home/byyz/桌面/api key.md
    port: 8110
    host: 127.0.0.1
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

use_oracle_code: true
record_video: true
use_visual_feedback: true
use_legacy_multi_turn_decision_prompt: false
save_multiturn_prompts: true
trials: 30
num_workers: 1
max_trial_retries: 1
trial_timeout_seconds: 1000
output_dir: ${oc.env:SORT_OUTPUT_DIR,./outputs/multi_object_sort_formal_l2_fallback_proof}

world_state_recorder:
  enabled: true
  record_every_n_sim_steps: 10
  record_rgb: false
  record_depth: false
  compress_arrays: true

execution_guard:
  enabled: true
  reject_empty_code: true
  max_robot_api_calls_per_block: 20
  max_expensive_loop_iterations: 0
  finish_requires_task_completed: true
  max_decision_reprompts: 1
  stage_expectations:
    - name: primary_grasped
      required:
        target_grasped: true
        object_lifted: true
        wrong_object_grasped: false
    - name: sort_complete
      required:
        task_completed: true
        objects_at_targets.primary: true
        gripper_open: true
        object_stable: true

text_world_state_feedback:
  enabled: true
  window_size: 3
  min_stable_fraction: 0.6667
  numeric_abs_tolerance: 0.015
  numeric_rel_tolerance: 0.05
  include_entities: false
  fail_open: false
  loop_guard_enabled: true
  max_same_failure_retries: 1
  min_progress_delta: 0.01
  action_aligned_window: true
  wait_for_stability: true
  stability_wait_steps: 5
  sample_sim_steps: 3

hybrid_recovery:
  enabled: true
  policy_first: false
  max_model_fallbacks_per_exception: 1
  max_model_fallbacks_total: 1
  model_recovery_stage_indices: [0, 1]
  model_recovery_template: bin_place_regrasp_replace_v1
  model_recovery_candidate_limit: 2
  min_remaining_sim_steps_before_regrasp: 320
  task_graph: env_configs/multi_object_sort/candidate_recovery_graph.yaml
  recovery_library: env_configs/multi_object_sort/candidate_recovery_library.yaml
  stage_actions: [stage_001]

metadata:
  status: fallback_proof
  level: L2
  task_family: multi_object_sort
  model_authority: bounded_template_selector
  expected_model_requests_per_trial_max: 1
  proof_seeds:
    role_binding_error: 22
    place_failed: 28
