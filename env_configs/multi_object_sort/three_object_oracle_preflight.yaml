env:
  _target_: capx.envs.tasks.franka.franka_multi_object_sort.FrankaThreeObjectSortCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_multi_object_sort_low_level
    low_level_kwargs:
      max_steps: 4800
      cube_A_half_sizes: 0.015,0.025,0.020
      cube_B_half_sizes: 0.018,0.028,0.020
      primary_color: red
      secondary_color: green
      object_shape: cuboid
      include_tertiary: true
      world_state_source: camera_rgbd
    privileged: false
    enable_render: true
    apis: [FrankaMultiObjectSortRgbdApi]

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand

use_oracle_code: true
record_video: true
use_visual_feedback: false
trials: 31
num_workers: 1
max_trial_retries: 1
trial_timeout_seconds: 600
output_dir: ${oc.env:SORT_OUTPUT_DIR,./outputs/three_object_sort_oracle_preflight}

world_state_recorder:
  enabled: true
  record_every_n_sim_steps: 10
  record_rgb: false
  record_depth: false
  compress_arrays: true

execution_guard:
  enabled: true
  reject_empty_code: true
  max_robot_api_calls_per_block: 40
  max_expensive_loop_iterations: 0
  finish_requires_task_completed: true

hybrid_recovery:
  enabled: false

metadata:
  status: diagnostic
  seeds: 31
  external_model_requests: 0
